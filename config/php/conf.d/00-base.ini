[PHP]
expose_php = Off
memory_limit = 256M
max_execution_time = 60
max_input_time = 60
post_max_size = 32M
upload_max_filesize = 32M
max_file_uploads = 20
date.timezone = Asia/Shanghai
log_errors = On
error_log = /php-msf/data/php/logs/php-error.log
display_errors = Off

[Session]
session.cookie_httponly = 1
session.cookie_samesite = Lax
