# user nginx;

worker_processes auto;

events {
    use epoll;
    worker_connections 51200;
    multi_accept on;
}

http {
    include       mime.types;
    default_type application/octet-stream;
    sendfile on;
    client_max_body_size 100m; 

    keepalive_timeout  120;

    gzip  on;

    include conf.d/*.conf;
}