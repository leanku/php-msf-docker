# 默认单实例配置。entrypoint 会根据 REDIS_CLUSTER_ENABLED 追加集群设置。
bind 0.0.0.0
port 6379
protected-mode yes
tcp-keepalive 300
timeout 0
daemonize no
supervised no
dir /php-msf/data/redis
dbfilename dump.rdb
appendonly yes
appendfilename appendonly.aof
appendfsync everysec
save 3600 1
save 300 100
save 60 10000
loglevel notice
logfile ""
